name: keychat
description: "KeyChat - a bring-your-own-key AI chatbot for Android and iOS."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.23.2
  hive_ce_flutter: ^2.5.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0 # Used directly for the custom code block builder.
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

# App icon generator. Replace the images in assets/icon/ with your own
# (1024x1024 PNG), then run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android 8+ adaptive icon: transparent foreground on a solid background.
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
